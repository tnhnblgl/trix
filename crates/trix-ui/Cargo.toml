[package]
name = "trix-ui"
version.workspace = true
edition.workspace = true
description = "Trix desktop app"

[[bin]]
name = "trix-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what makes `asset:` available, and with it
# `Manager::asset_protocol_scope()` — the runtime hook Task 5 needs, because
# `clip_dir` is a config key and cannot be a static scope in tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
trix-proto = { path = "../trix-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
semver = "1"
sha2 = "0.10"
# `native-tls` rather than `rustls`: on Windows it resolves to schannel and uses
# the certificate store the OS already maintains, which is both smaller and
# correct on machines with a corporate trust root.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Reading the release zip, and nothing else. `default-features = false` drops
# AES, bzip2, zstd, lzma, xz, ppmd and deflate64 -- a `ZipFile::CreateFromDirectory`
# archive uses none of them, and every codec left enabled is parser surface that
# runs over bytes downloaded from the internet.
#
# `deflate-flate2-zlib-rs` rather than the `deflate` umbrella: under zip 8
# `deflate` expands to `deflate-zopfli` + `deflate-flate2-zlib-rs`, and zopfli
# is a *compressor*. Trix only ever reads a zip, so the umbrella pulls in a
# crate no code path here can reach. Bare `deflate-flate2` is not the answer
# either -- zip depends on flate2 with `default-features = false`, so it selects
# no backend at all and flate2 fails the build with "You need to choose a zlib
# backend". `-zlib-rs` names one, and it is the pure-Rust port, so this adds no
# C to the link.
#
# Version 8, not the 2 the plan named: 2.x is superseded, and `ZipArchive::extract`
# is precisely the function RUSTSEC-2025-0168 (arbitrary file write via symlinked
# paths) was filed against. Current majors carry that fix by construction rather
# than by a version floor nobody re-checks.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# `PeekNamedPipe` (Win32_System_Pipes) and `HANDLE` (Win32_Foundation), for the
# non-blocking pipe reader in `src/pipe_reader.rs` -- see the long comment there.
# `Win32_System_Threading` is `Supervisor::stop`'s `OpenProcess`/`TerminateProcess`
# fallback for a daemon that acknowledged `shutdown` and then wedged. These three
# features are the whole of what the shipped binary uses, and they are spelled
# out here rather than inherited with `windows.workspace = true`. Inheriting is
# not narrower, it is wider: it pulls the workspace's entire list, including
# `Win32_Graphics_Direct3D11`, `Win32_Graphics_Dxgi` and
# `Win32_Media_MediaFoundation` -- the encoder and capture surface area -- into
# the one crate whose design rule is that it reaches the engine only over the
# control socket. The version is pinned to the workspace's `0.62` by hand so the
# two move together; there is no `windows` feature the UI wants that the engine
# does not already have.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }

# DELIBERATELY ABSENT: trix-core. See spec 3.2 and scripts/ui-isolation.ps1.
# The UI's every capability arrives over the control socket, which is the only
# thing that keeps that socket good enough for a third-party UI to use.

[dev-dependencies]
# The stub pipe server in `tests/pipe_roundtrip.rs` binds its own private pipe
# instance, which the shipped binary never does -- it is a client and nothing
# else. Cargo unions these onto the list above for test builds only, so they
# widen the tests and not what ships. All three are needed by signatures rather
# than by anything the stub actually passes: `CreateNamedPipeW` names
# `FILE_FLAGS_AND_ATTRIBUTES` (Win32_Storage_FileSystem) and
# `SECURITY_ATTRIBUTES` (Win32_Security, though the stub passes `None` and takes
# the default DACL), and `ConnectNamedPipe` names `OVERLAPPED`
# (Win32_System_IO, though the pipe is synchronous and the stub passes `None`).
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
