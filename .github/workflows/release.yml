# Builds the release zip on a clean runner, from nothing but what is in this
# repository, and drafts the GitHub release it belongs to.
#
# Where the tag comes from is unchanged: a draft release carries no tag, so
# nothing exists publicly and nothing is tagged until the draft is published by
# hand. This workflow never pushes a tag.
#
# The run comes apart in the middle for a reason that outlived its first cause.
# A code-signing service will only certify binaries it can watch being built
# from public source, which is why the build moved here; SignPath Foundation
# turned the application down for now, wanting a more established project. The
# seam is kept: signing rewrites the three .exe files, so it has to happen
# between staging and packaging, and the gap is marked below.
#
# The gates are not reimplemented here. scripts\ship-zip.ps1 owns them, run in
# its two halves, so CI and a hand-built zip are held to the same standard and
# there is only one place to change it. It is run under `powershell` (5.1)
# rather than the runner's default pwsh, because that is what it is run under
# locally, and .NET Framework and .NET write zip entry names differently.

name: Release zip

on:
  workflow_dispatch:

# Write, because the last step creates a draft release. Nothing else in the
# token's reach is needed.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # The trix-ui link is fat LTO at codegen-units = 1, and a runner is slower
    # than the machine this normally runs on.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/trix-ui/web/package-lock.json

      # ~/.cargo/bin carries cargo-tauri, so it is only compiled on a run whose
      # key misses. The build directory is deliberately not cached: a release
      # build's target\ is enormous, and caching it risks handing a release
      # artifact stale object files.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the tauri CLI
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
          }

      - name: Install frontend packages
        working-directory: crates/trix-ui/web
        run: npm ci

      # Gates, both test suites, the release build, and the staging folder the
      # zip is made of. Stops there.
      - name: Test, build and stage
        run: powershell -ExecutionPolicy Bypass -File scripts\ship-zip.ps1 -StageOnly -StageDir "${{ runner.temp }}\stage"

      # SIGNING GOES HERE: submit ${{ runner.temp }}\stage\trix-v*-win-x64\*.exe
      # to SignPath and write the signed files back over the staged ones.

      - name: Package
        run: powershell -ExecutionPolicy Bypass -File scripts\ship-zip.ps1 -FromStage -StageDir "${{ runner.temp }}\stage" -OutDir "${{ runner.temp }}\out"

      # Kept alongside the release: an artifact survives a draft being deleted
      # and is what a failed publish falls back on.
      - name: Upload the zip and its hash
        uses: actions/upload-artifact@v7
        with:
          name: trix-win-x64
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

      # A draft, never a published release: publishing is what creates the tag,
      # and that stays a decision made by a person. The version is read from the
      # staging folder's release.json rather than typed here, so the tag cannot
      # disagree with the binaries.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Explicit, because a native command's exit code is handled
          # differently across PowerShell versions, and this script reads
          # $LASTEXITCODE itself.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $manifest = Get-Content "${{ runner.temp }}\stage\release.json" -Raw | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          $zip = "${{ runner.temp }}\out\$($manifest.name).zip"
          $sums = "${{ runner.temp }}\out\SHA256SUMS.txt"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error::a release or draft named $tag already exists. Bump the version, or delete that release first."
            exit 1
          }

          gh release create $tag --draft --title $tag --generate-notes --target $env:GITHUB_SHA $zip $sums
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "::notice::Drafted $tag with the zip and SHA256SUMS.txt. The generated notes are a commit list -- rewrite them, then publish, which is what creates the tag."
